name: Discover dangling connector domains

on:
  workflow_dispatch: {}
  schedule:
    # Weekly, Monday 06:00 UTC.
    - cron: '0 6 * * 1'

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Azure login (read-only)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_PLAN }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install DnsClient-PS module
        shell: pwsh
        run: Install-Module -Name DnsClient-PS -Scope CurrentUser -Force -ErrorAction Stop

      - name: Run domain discovery script
        shell: pwsh
        run: ./Update-DanglingConnectorDomain.ps1 -AzureSubscriptionId '${{ secrets.AZURE_SUBSCRIPTION_ID }}'

      - name: Upload full CSV report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unregistered-connector-domains-csv
          path: UnregisteredConnectorDomains.csv
          retention-days: 14

      # Only the azurewebsites.net tracking JSON is committed - the broader CSV
      # (every unregistered connector domain, not just azurewebsites.net) stays an
      # artifact for manual triage, it isn't infrastructure input.
      #
      # Note: this uses the default GITHUB_TOKEN, which means the PR it opens will
      # NOT trigger tofu-plan.yml (GitHub suppresses workflow-triggered-workflow
      # runs from the default token to prevent loops). Set secrets.INFRA_PR_TOKEN to
      # a PAT or GitHub App token with contents+pull-requests write for that to work;
      # otherwise re-run tofu-plan manually (or push an empty commit) on the PR.
      - name: Open PR with updated domain tracking
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.INFRA_PR_TOKEN || secrets.GITHUB_TOKEN }}
          commit-message: 'Update dangling azurewebsites.net domain tracking'
          title: 'Update dangling azurewebsites.net domain tracking'
          body: |
            Automated update from the scheduled connector-domain scan.

            The full CSV of every unregistered connector domain (not just
            azurewebsites.net) is attached as a workflow artifact on the run that
            opened this PR, for manual triage.

            Merging this will cause `tofu apply` (on push to main) to create a
            catcher Function App for any newly added domain, and destroy the
            Function App for any domain removed here - but only for entries whose
            `nameAvailable` is `true`; see each entry's `nameAvailabilityReason`/
            `nameCheckedDate` for domains currently skipped as unclaimable.
          branch: automation/dangling-domain-tracking
          add-paths: UnregisteredAzureWebsitesDomains.json
          delete-branch: true
