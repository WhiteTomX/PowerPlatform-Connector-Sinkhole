name: OpenTofu apply

on:
  push:
    branches: [main]
    paths:
      - 'tofu/**'
      - 'UnregisteredAzureWebsitesDomains.json'
      - '.github/workflows/tofu-apply.yml'
      - '.github/workflows/tofu-plan.yml'

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: tofu-apply
  cancel-in-progress: false

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID_APPLY }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_USE_OIDC: true

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: tofu apply
        uses: dflook/tofu-apply@e3e5dfc8f935d4b152c767801046f63abf8a77d3 # v3.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path: tofu
          backend_config: |
            resource_group_name=${{ secrets.TFSTATE_RESOURCE_GROUP }}
            storage_account_name=${{ secrets.TFSTATE_STORAGE_ACCOUNT }}
            container_name=${{ secrets.TFSTATE_CONTAINER }}
            key=${{ secrets.TFSTATE_KEY }}
