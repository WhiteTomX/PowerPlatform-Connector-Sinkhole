name: OpenTofu plan

on:
  pull_request:
    paths:
      - 'tofu/**'
      - 'UnregisteredAzureWebsitesDomains.json'
      - '.github/workflows/tofu-plan.yml'

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: tofu-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID_PLAN }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_USE_OIDC: true

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tofu
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1

      - name: tofu init
        run: |
          tofu init -input=false \
            -backend-config="resource_group_name=${{ secrets.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.TFSTATE_CONTAINER }}" \
            -backend-config="key=${{ secrets.TFSTATE_KEY }}"

      - name: tofu plan
        id: plan
        run: |
          set +e
          tofu plan -input=false -no-color -detailed-exitcode 2>&1 | tee plan_output.txt
          echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Comment plan on PR
        uses: actions/github-script@v7
        env:
          PLAN_EXIT_CODE: ${{ steps.plan.outputs.exitcode }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            let planText = fs.readFileSync(path.join('tofu', 'plan_output.txt'), 'utf8');
            const maxLen = 60000;
            if (planText.length > maxLen) {
              planText = planText.slice(-maxLen) + '\n\n... (truncated, see workflow logs for the full plan)';
            }

            const exitCode = process.env.PLAN_EXIT_CODE;
            const outcome = { '0': 'no changes', '2': 'changes present' }[exitCode] ?? 'error';
            const marker = '<!-- opentofu-plan -->';
            const body = `${marker}\n### OpenTofu plan\nOutcome: **${outcome}** (exit code \`${exitCode}\`)\n\n<details><summary>Show plan</summary>\n\n\`\`\`hcl\n${planText}\n\`\`\`\n\n</details>`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if plan errored
        if: steps.plan.outputs.exitcode == 1
        run: exit 1
